<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#3730A3" />
    <title>Offline | PAVEPADI</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        padding: 24px; background: #f7f8ff; color: #111827;
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .card {
        width: min(100%, 420px); padding: 32px; border: 1px solid #e5e7eb;
        border-radius: 24px; background: white; text-align: center;
        box-shadow: 0 16px 48px #1f29371a;
      }
      .logo { width: 72px; height: 72px; object-fit: contain; margin: auto; }
      .muted { color: #6b7280; font-size: 14px; }
      .button {
        display: inline-block; margin-top: 16px; border: 0; border-radius: 10px;
        padding: 12px 20px; background: #3730a3; color: white;
        font: 600 14px system-ui; cursor: pointer; text-decoration: none;
      }
      .button[aria-disabled="true"] { opacity: 0.7; pointer-events: none; }
      .status { min-height: 1.5em; margin: 12px 0 0; color: #b45309; font-size: 13px; }
    </style>
  </head>
  <body>
    <main class="card">
      <img class="logo" src="/icons/pave-192.png" alt="PAVEPADI" />
      <h1>Can't reach PAVEPADI</h1>
      <p class="muted">
        We couldn't connect to PAVEPADI. Check your data or Wi-Fi and try again.
        Live balances and financial actions are unavailable until you reconnect.
      </p>
      <a id="retry" class="button" href="/">Retry connection</a>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </main>
    <script src="/offline.js"></script>
  </body>
</html>
